name: 操作失败或教程错误
description: 提交可复现的步骤、证据与截图（须脱敏）
title: "[BUG] "
labels: [bug]
body:
  - type: textarea
    id: where
    attributes:
      label: 涉及章节 / 网站位置
      description: 粘贴页面链接或标题
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与现象
      description: 不要放密码、Token、客户信息或验证码
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为与官方参考
      description: 请提供官网链接；不确定则写“未知”
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私自检
      options:
        - label: 我已移除敏感信息
          required: true
